apiVersion: apps/v1
kind: Deployment
metadata:
  name: payd-frontend
  labels:
    app: payd
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payd
      component: frontend
  template:
    metadata:
      labels:
        app: payd
        component: frontend
    spec:
      containers:
        - name: frontend
          image: payd-frontend:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
