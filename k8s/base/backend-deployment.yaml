apiVersion: apps/v1
kind: Deployment
metadata:
  name: payd-backend
  labels:
    app: payd
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payd
      component: backend
  template:
    metadata:
      labels:
        app: payd
        component: backend
    spec:
      containers:
        - name: backend
          image: payd-backend:latest
          ports:
            - containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: payd-backend-config
            - secretRef:
                name: payd-backend-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
