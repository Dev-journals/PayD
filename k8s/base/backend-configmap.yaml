apiVersion: v1
kind: ConfigMap
metadata:
  name: payd-backend-config
  labels:
    app: payd
    component: backend
data:
  PORT: "3001"
  NODE_ENV: "production"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "payd_db"
  REDIS_URL: "redis://redis:6379"
  LOG_LEVEL: "info"
  ENABLE_CACHING: "true"
  CACHE_TTL: "3600"
